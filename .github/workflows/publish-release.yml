name: Publish delivery release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged delivery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect delivery content change
        id: delivery
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}")"
          if grep -Eq '^(release-manifest\.yaml|RELEASE-NOTES\.md|sources/|artifacts/|configuration/|docs/|evidence/|compliance/|other/)' <<< "${changed_files}"; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Python
        if: steps.delivery.outputs.changed == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install manifest parser
        if: steps.delivery.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements.txt

      - name: Publish release
        if: steps.delivery.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          supplier_version="$(python -c 'import yaml; print(yaml.safe_load(open("release-manifest.yaml", encoding="utf-8"))["supplierVersion"])')"
          safe_version="$(sed 's/[^A-Za-z0-9._-]/-/g' <<< "${supplier_version}")"
          staging_tag="staging/${safe_version}"

          merge_epoch="$(git show -s --format=%ct "${MERGE_SHA}")"
          delivery_date="$(date -u -d "@${merge_epoch}" +%F)"
          release_id="${delivery_date}-${safe_version}"
          tag_name="release/${release_id}"

          suffix=1
          while gh api "repos/${REPOSITORY}/git/ref/tags/${tag_name}" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            tag_name="release/${release_id}-${suffix}"
          done

          if ! draft="$(gh api "repos/${REPOSITORY}/releases/tags/${staging_tag}" 2>/dev/null)"; then
            echo "Nessuna release di staging '${staging_tag}' trovata. Assicurati che il branch delivery sia stato pushato prima del merge." >&2
            exit 1
          fi

          # Verifica solo l'esistenza per nome degli asset richiesti (nessun controllo hash)
          expected_assets="$(python -c '
          materials = __import__("yaml").safe_load(open("release-manifest.yaml", encoding="utf-8")).get("materials", {})
          for artifact in materials.get("artifacts", []):
              print(artifact["name"])
          ')"

          missing_assets=""
          while IFS= read -r asset_name; do
            [[ -z "${asset_name}" ]] && continue
            if ! jq -e --arg name "${asset_name}" '.assets[] | select(.name == $name)' <<< "${draft}" >/dev/null; then
              missing_assets+="${asset_name}"$'\n'
            fi
          done <<< "${expected_assets}"

          if [[ -n "${missing_assets}" ]]; then
            echo "Asset mancanti nella release di staging '${staging_tag}':" >&2
            echo "${missing_assets}" >&2
            echo "La release resta in stato draft. Carica i file mancanti dalla UI e rilancia questo workflow (workflow_dispatch)." >&2
            exit 1
          fi

          release_number="$(jq -r '.id' <<< "${draft}")"
          gh api --method PATCH "repos/${REPOSITORY}/releases/${release_number}" \
            -f "tag_name=${tag_name}" \
            -f "target_commitish=${MERGE_SHA}" \
            -F "draft=false" \
            -f "name=${tag_name}" \
            --raw-field "body=$(cat RELEASE-NOTES.md)" >/dev/null

          echo "Published ${tag_name}"
