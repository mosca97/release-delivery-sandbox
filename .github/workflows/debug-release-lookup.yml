name: Debug release lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect gh/jq and release lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -x
          gh --version
          jq --version
          echo "--- raw list ---"
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" | head -c 2000
          echo
          echo "--- filtered via gh --jq ---"
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"staging/v1.2.0\" or .name == \"staging/v1.2.0\")]"
          echo "--- length ---"
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"staging/v1.2.0\" or .name == \"staging/v1.2.0\")] | length"
