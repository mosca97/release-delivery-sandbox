name: Stage delivery release

on:
  push:
    branches:
      - 'delivery/**'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install manifest parser
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements.txt

      - name: Create or update staging draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f delivery/release-manifest.yaml || ! -f delivery/RELEASE-NOTES.md ]]; then
            echo "delivery/release-manifest.yaml o delivery/RELEASE-NOTES.md non ancora presenti a questo commit: nessuna draft da creare."
            exit 0
          fi

          supplier_version="$(python -c 'import yaml; print(yaml.safe_load(open("delivery/release-manifest.yaml", encoding="utf-8"))["supplierVersion"])')"
          safe_version="$(sed 's/[^A-Za-z0-9._-]/-/g' <<< "${supplier_version}")"
          tag_name="staging/${safe_version}"

          # NB1: GET /releases/tags/{tag} non trova le draft release: una
          # draft non crea il git tag reale finche' non viene pubblicata,
          # quindi l'endpoint per-tag risponde sempre 404. Bisogna elencare
          # tutte le release e filtrare lato client.
          # NB2: caricare asset su una draft dalla UI di GitHub puo' far
          # rigenerare tag_name in un placeholder "untagged-xxxxx" (il campo
          # "name" resta invece stabile). Il filtro considera quindi anche
          # "name" per ritrovare la draft, e il PATCH sotto ripristina
          # sempre tag_name a quello corretto.
          matches="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${tag_name}\" or .name == \"${tag_name}\")]")"
          match_count="$(jq 'length' <<< "${matches}")"

          if [[ "${match_count}" -gt 1 ]]; then
            echo "Trovate ${match_count} release con tag '${tag_name}': rimuovi manualmente i duplicati prima di continuare." >&2
            jq -r '.[] | "  id=\(.id) created_at=\(.created_at)"' <<< "${matches}" >&2
            exit 1
          fi

          if [[ "${match_count}" -eq 1 ]]; then
            release_number="$(jq -r '.[0].id' <<< "${matches}")"
            gh api --method PATCH "repos/${REPOSITORY}/releases/${release_number}" \
              -f "tag_name=${tag_name}" \
              -f "target_commitish=${COMMIT_SHA}" \
              -f "name=${tag_name}" \
              --raw-field "body=$(cat delivery/RELEASE-NOTES.md)" >/dev/null
            echo "Draft di staging aggiornata: ${tag_name}"
          else
            gh api --method POST "repos/${REPOSITORY}/releases" \
              -f "tag_name=${tag_name}" \
              -f "target_commitish=${COMMIT_SHA}" \
              -F "draft=true" \
              -f "name=${tag_name}" \
              --raw-field "body=$(cat delivery/RELEASE-NOTES.md)" >/dev/null
            echo "Draft di staging creata: ${tag_name}"
          fi

          echo "Carica manualmente gli asset richiesti dal manifest sulla release '${tag_name}' dalla UI di GitHub." >> "${GITHUB_STEP_SUMMARY}"
