name: Validate delivery

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validator from default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: validator
          persist-credentials: false

      - name: Checkout delivery commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: delivery
          fetch-depth: 0
          persist-credentials: false

      - name: Reject changes to protected automation
        working-directory: delivery
        shell: bash
        run: |
          changed_files="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          if grep -q '^\.github/' <<< "${changed_files}"; then
            echo "The delivery PR must not modify .github/."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check --requirement validator/scripts/requirements.txt

      - name: Validate delivery
        run: python validator/scripts/validate_delivery.py --repo delivery
