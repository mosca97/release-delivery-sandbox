name: Validate delivery

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'delivery/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validator from default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: validator
          persist-credentials: false

      - name: Checkout delivery commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: delivery
          fetch-depth: 0
          persist-credentials: true

      - name: Reject changes to protected automation
        working-directory: delivery
        shell: bash
        run: |
          git fetch origin main --no-tags
          changed_files="$(git diff --name-only \
            origin/main \
            HEAD)"
          if grep -Eq '^(\.github/|schema/|scripts/|README\.md$|SUPPLIER-GUIDE\.md$|\.gitignore$|\.gitattributes$)' <<< "${changed_files}"; then
            echo "The delivery PR must not modify framework-controlled paths."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check --requirement validator/scripts/requirements.txt

      - name: Validate delivery
        run: python validator/scripts/validate_delivery.py --repo delivery

      - name: Verify release assets are uploaded
        working-directory: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          supplier_version="$(python -c 'import yaml; print(yaml.safe_load(open("release-manifest.yaml", encoding="utf-8"))["supplierVersion"])')"
          safe_version="$(sed 's/[^A-Za-z0-9._-]/-/g' <<< "${supplier_version}")"
          staging_tag="staging/${safe_version}"

          if ! draft="$(gh api "repos/${REPOSITORY}/releases/tags/${staging_tag}" 2>/dev/null)"; then
            echo "Nessuna release di staging '${staging_tag}' trovata. Fai il push del branch delivery e carica gli asset prima di aprire/aggiornare la PR." >&2
            exit 1
          fi

          expected_assets="$(python -c '
          materials = __import__("yaml").safe_load(open("release-manifest.yaml", encoding="utf-8")).get("materials", {})
          for artifact in materials.get("artifacts", []):
              print(artifact["name"])
          ')"

          missing_assets=""
          while IFS= read -r asset_name; do
            [[ -z "${asset_name}" ]] && continue
            if ! jq -e --arg name "${asset_name}" '.assets[] | select(.name == $name)' <<< "${draft}" >/dev/null; then
              missing_assets+="${asset_name}"$'\n'
            fi
          done <<< "${expected_assets}"

          if [[ -n "${missing_assets}" ]]; then
            echo "Asset mancanti nella release di staging '${staging_tag}':" >&2
            echo "${missing_assets}" >&2
            exit 1
          fi

          echo "Tutti gli asset richiesti sono presenti in '${staging_tag}'."
